    <script>
        // State Management
        const state = {
            currentTab: 'home',
            materiASubTab: 'a1',
            materiBSubTab: 'b1',
            progress: JSON.parse(localStorage.getItem('ipas_progress')) || {
                readSections: [],
                completedQuizzes: {},
                challenges: [],
                evaluationScore: null,
                reflections: {}
            }
        };

        function saveProgress() {
            localStorage.setItem('ipas_progress', JSON.stringify(state.progress));
            updateProgressUI();
        }

        function markSectionAsRead(sectionId) {
            if (!state.progress.readSections.includes(sectionId)) {
                state.progress.readSections.push(sectionId);
                saveProgress();
            }
        }

        function updateProgressUI() {
            const totalModules = 35; // Total sections & features
            const readCount = state.progress.readSections.length;
            const percentage = Math.min(100, Math.round((readCount / totalModules) * 100));
            
            const bar = document.getElementById('topProgressBar');
            const text = document.getElementById('topProgressText');
            if (bar) bar.style.width = percentage + '%';
            if (text) text.innerText = percentage + '%';
        }

        function toggleMobileMenu() {
            const drawer = document.getElementById('mobileMenuDrawer');
            drawer.classList.toggle('hidden');
        }

        function navigateTo(tab, subTab = null) {
            state.currentTab = tab;
            if (subTab) {
                if (tab === 'materiA') state.materiASubTab = subTab;
                if (tab === 'materiB') state.materiBSubTab = subTab;
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
            renderView();
            document.getElementById('mobileMenuDrawer').classList.add('hidden');
        }

        // Render Controller
        function renderView() {
            const container = document.getElementById('appContainer');
            container.innerHTML = ''; // Clear container

            switch (state.currentTab) {
                case 'home':
                    renderHomeView(container);
                    break;
                case 'menu':
                    renderMainMenuView(container);
                    break;
                case 'materiA':
                    renderMateriAView(container);
                    break;
                case 'materiB':
                    renderMateriBView(container);
                    break;
                case 'dpib':
                    renderDPIBView(container);
                    break;
                case 'kuliner':
                    renderKulinerView(container);
                    break;
                case 'kuis':
                    renderKuisMenu(container);
                    break;
                case 'evaluasi':
                    renderEvaluasiView(container);
                    break;
                case 'tantangan':
                    renderTantanganView(container);
                    break;
                case 'refleksi':
                    renderRefleksiView(container);
                    break;
                case 'selesai':
                    renderSelesaiView(container);
                    break;
                default:
                    renderHomeView(container);
            }
            updateProgressUI();
        }
    </script>

        // Helpers for Sub-materi A
        let particleCanvasAnimId = null;
        let particleState = 'padat';

        function setParticleState(st) {
            particleState = st;
            const info = document.getElementById('particleInfo');
            if (st === 'padat') {
                info.innerHTML = '<strong>Zat Padat:</strong> Partikel terikat sangat kuat, tidak dapat bebas berpindah tempat. Jarak antarpartikel rapat & tersusun teratur.';
            } else if (st === 'cair') {
                info.innerHTML = '<strong>Zat Cair:</strong> Partikel dapat meluncur dan berpindah tempat secara bebas terbatas, namun tetap dalam kelompoknya. Jarak antarpartikel relatif agak renggang.';
            } else if (st === 'gas') {
                info.innerHTML = '<strong>Zat Gas:</strong> Partikel bergerak sangat cepat ke segala arah dengan frekuensi tumbukan tinggi. Jarak antarpartikel sangat jauh.';
            }
        }

        function initParticleCanvas() {
            const canvas = document.getElementById('particleCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            setParticleState('padat');

            let particles = [];
            for (let i = 0; i < 40; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 0.5) * 2,
                    radius: 7
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (particleState === 'padat') {
                    let cols = 8, rows = 5;
                    let startX = (canvas.width - cols * 25) / 2;
                    let startY = (canvas.height - rows * 25) / 2;
                    let idx = 0;
                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c < cols; c++) {
                            if (idx < particles.length) {
                                let px = startX + c * 25 + (Math.random() - 0.5) * 1.5;
                                let py = startY + r * 25 + (Math.random() - 0.5) * 1.5;
                                ctx.beginPath();
                                ctx.arc(px, py, 7, 0, Math.PI * 2);
                                ctx.fillStyle = '#06b6d4';
                                ctx.fill();
                                ctx.strokeStyle = '#0891b2';
                                ctx.stroke();
                                idx++;
                            }
                        }
                    }
                } else if (particleState === 'cair') {
                    particles.forEach(p => {
                        p.x += p.vx * 0.8;
                        p.y += p.vy * 0.8;

                        if (p.x < 20 || p.x > canvas.width - 20) p.vx *= -1;
                        if (p.y < canvas.height - 80 || p.y > canvas.height - 20) p.vy *= -1;

                        ctx.beginPath();
                        ctx.arc(p.x, p.y, 7, 0, Math.PI * 2);
                        ctx.fillStyle = '#3b82f6';
                        ctx.fill();
                    });
                } else if (particleState === 'gas') {
                    particles.forEach(p => {
                        p.x += p.vx * 3;
                        p.y += p.vy * 3;

                        if (p.x < 10 || p.x > canvas.width - 10) p.vx *= -1;
                        if (p.y < 10 || p.y > canvas.height - 10) p.vy *= -1;

                        ctx.beginPath();
                        ctx.arc(p.x, p.y, 7, 0, Math.PI * 2);
                        ctx.fillStyle = '#a855f7';
                        ctx.fill();
                    });
                }

                particleCanvasAnimId = requestAnimationFrame(animate);
            }
            cancelAnimationFrame(particleCanvasAnimId);
            animate();
        }

            { q: "Rumus matematis untuk menghitung Usaha (W) dalam fisika adalah...", opts: ["W = m × g", "W = F × s", "W = P × t", "W = V × I"], ans: 1 },

        function renderEvaluasiView(container) {
            markSectionAsRead('evaluasi');
            container.innerHTML = `
            <div class="fade-in space-y-8">

                    </div>

                <div id="evalResultBox" class="hidden bg-slate-900 text-white p-8 rounded-3xl space-y-6">
                    <!-- Dynamic score injected here -->
                </div>
            </div>
            `;

            const list = document.getElementById('evalQuestionsList');
            evalQuestions.forEach((item, idx) => {
                const qEl = document.createElement('div');
                qEl.className = 'p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-3';
                qEl.innerHTML = `
                <div class="font-bold text-sm text-slate-800">
                    <span class="text-purple-600">${idx + 1}.</span> ${item.q}

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                    ${item.opts.map((opt, oIdx) => `
                        <label class="flex items-center space-x-2 bg-white p-2.5 rounded-lg border cursor-pointer hover:bg-purple-50">
                            <input type="radio" name="q${idx}" value="${oIdx}" required class="accent-purple-600">
                            <span>${opt}</span>
                        </label>
                    `).join('')}
                </div>
                `;
                list.appendChild(qEl);
            });
        }

        function submitEvaluasi(e) {
            e.preventDefault();
            let score = 0;
            evalQuestions.forEach((item, idx) => {
                const selected = document.querySelector(`input[name="q${idx}"]:checked`);
                if (selected && parseInt(selected.value) === item.ans) {
                    score += 5; // 20 questions * 5 = 100 max
                }
            });

            state.progress.evaluationScore = score;
            saveProgress();

            const box = document.getElementById('evalResultBox');
            box.classList.remove('hidden');
            document.getElementById('evalForm').classList.add('hidden');

            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });

            box.innerHTML = `
            <div class="text-center space-y-4">
                <div class="w-20 h-20 bg-purple-500/20 rounded-full flex items-center justify-center mx-auto text-purple-400 text-4xl border border-purple-500/30">

                </div>
                <h3 class="text-2xl font-bold">Hasil Evaluasi Sumatif Kamu</h3>
                <div class="text-5xl font-black text-amber-400 font-mono">${score} / 100</div>
                <p class="text-xs text-slate-300">
                    ${score >= 75 ? 'Luar biasa! Kamu telah menguasai konsep Projek IPAS dengan Sangat Baik!' : 'Bagus! Pelajari kembali beberapa materi yang masih membingungkan dan coba lagi!'}

                    Lihat Halaman Ringkasan Akhir & Sertifikat
                </button>
            </div>
            `;
        }
    </script>

                        <select id="refLevel" class="w-full p-3 bg-slate-50 border rounded-xl text-xs font-bold text-brand-600">
                            <option value="Sangat Paham">⭐ Sangat Paham</option>
                            <option value="Paham">🙂 Paham</option>
                            <option value="Cukup Paham">😐 Cukup Paham</option>
                            <option value="Masih Perlu Belajar">😕 Masih Perlu Belajar</option>
                        </select>
                    </div>

                    <button type="submit" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs py-3 rounded-xl transition">
                        Simpan Jurnal Refleksi
                    </button>
                    <div id="refSavedAlert" class="hidden text-xs font-bold text-emerald-600 text-center">Jurnal refleksi berhasil disimpan!</div>
                </form>
            </div>
            `;
        }

        function saveReflectionForm(e) {
            e.preventDefault();
            state.progress.reflections = {
                r1: document.getElementById('ref1').value,
                r2: document.getElementById('ref2').value,
                r3: document.getElementById('ref3').value,
                level: document.getElementById('refLevel').value
            };
            saveProgress();
            document.getElementById('refSavedAlert').classList.remove('hidden');
        }
    </script>
